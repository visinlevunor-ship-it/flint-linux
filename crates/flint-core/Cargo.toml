[package]
name = "flint-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = ["std"]
# Everything except `version` needs std + libc. flint-rt based programs turn this off.
std = ["dep:libc"]

[dependencies]
libc = { workspace = true, optional = true }
