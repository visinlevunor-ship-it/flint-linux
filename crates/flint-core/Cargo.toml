[package]
name = "flint-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = ["std"]
# Everything except `version` needs std + libc. flint-rt based programs turn this off.
std = ["dep:libc", "dep:flint-libc"]

[dependencies]
libc = { workspace = true, optional = true }

# Flint's own C library replaces musl in every program built for Linux.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "musl"))'.dependencies]
flint-libc = { path = "../flint-libc", optional = true }
