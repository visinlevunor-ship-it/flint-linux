# Flint boot menu (read by flint-boot). Paths are on this partition; \ or / both work.
#
#   timeout SECONDS     before the first entry boots (0 = at once; any key stops it)
#   default N           entry selected at start (counting from 1)
#   entry TITLE         a menu entry, followed by its kernel, initrd and options lines
timeout 3

entry Flint Linux
  kernel \FLINT\KERNEL
  initrd \FLINT\BASE.IMG
  initrd \FLINT\MODULES.IMG
  initrd \FLINT\FIRMWARE.IMG
  options quiet loglevel=3

entry Flint Linux (show kernel messages)
  kernel \FLINT\KERNEL
  initrd \FLINT\BASE.IMG
  initrd \FLINT\MODULES.IMG
  initrd \FLINT\FIRMWARE.IMG
  options loglevel=7

entry Flint Linux (live: keep nothing, change nothing on the disk)
  kernel \FLINT\KERNEL
  initrd \FLINT\BASE.IMG
  initrd \FLINT\MODULES.IMG
  initrd \FLINT\FIRMWARE.IMG
  options quiet loglevel=3 flint.persist=0

entry Flint Linux (also on serial port ttyS0)
  kernel \FLINT\KERNEL
  initrd \FLINT\BASE.IMG
  initrd \FLINT\MODULES.IMG
  initrd \FLINT\FIRMWARE.IMG
  options console=tty0 console=ttyS0,115200
