# Graphics: AMD (amdgpu, radeon), Intel (i915, xe), virtual machines. The firmware each
# driver declares comes along automatically. NVIDIA (nouveau) stays out for now: newer
# cards need ~100 MB of GSP firmware, and without it nouveau would blank the screen after
# taking it over from the firmware framebuffer, which keeps working without it.
module drivers/gpu/drm/
skip drivers/gpu/drm/nouveau/
skip drivers/gpu/drm/vkms
skip drivers/gpu/drm/vgem
skip drivers/gpu/drm/xen/
skip drivers/gpu/drm/gud/
skip drivers/gpu/drm/udl/
skip drivers/gpu/drm/solomon/
skip drivers/gpu/drm/sitronix/
skip drivers/gpu/drm/tiny/repaper
skip drivers/gpu/drm/tiny/st7586
skip drivers/gpu/drm/tiny/st7735r
skip drivers/gpu/drm/tiny/ili9
skip drivers/gpu/drm/tiny/hx8357d
skip drivers/gpu/drm/tiny/mi0283qt
skip drivers/gpu/drm/panel/
module drivers/video/
module drivers/acpi/video

# Filesystems for USB sticks and other disks
module fs/fat/
module fs/exfat/
module fs/ntfs3/
module fs/isofs/
module fs/udf/
module fs/nls/
module fs/ext4/
module fs/jbd2/
module fs/fuse/
module fs/overlayfs/

# Early: what is needed to reach the boot partition (disks, USB, card readers, their
# filesystems) and to switch to the data partition. Only these sit in RAM (EARLY.IMG); the
# rest is loaded from the boot partition once it is mounted (FLINT/DRIVERS).
early drivers/ata/
early drivers/nvme/
early drivers/scsi/
early drivers/block/
early drivers/mmc/
early drivers/memstick/
early drivers/misc/cardreader/
early drivers/usb/host/
early drivers/usb/storage/
early drivers/usb/common/
early drivers/usb/core/
early drivers/pci/controller/
early drivers/virtio/
early drivers/hid/usbhid/
early drivers/hid/hid-generic
early fs/fat/
early fs/nls/
early fs/ext4/
early fs/jbd2/
early fs/overlayfs/

# Firmware that drivers load without declaring it.
firmware brcm/brcmfmac*
firmware cypress/*
firmware iwlwifi-*.pnvm
firmware intel/iwlwifi/*.pnvm
firmware regulatory.db*
firmware rtw88/*
firmware rtw89/*
firmware rtl_nic/*
firmware rtlwifi/*
firmware mediatek/WIFI_*
firmware mediatek/mt76*
