module drivers/hid/
module drivers/input/
module drivers/platform/x86/
module drivers/pinctrl/
module drivers/i2c/
module drivers/mfd/
module drivers/gpio/
module drivers/dma/
module drivers/bus/
module drivers/acpi/
module drivers/pci/
module drivers/hv/
module drivers/char/
skip drivers/char/ipmi/
skip drivers/char/tpm/
skip drivers/char/xillybus/

