# Which kernel modules and firmware go into the Flint image.
#
#   module PREFIX     include every module under kernel/PREFIX
#   skip PREFIX       ...except these (a module something included depends on still comes along)
#   firmware GLOB     firmware to include besides what the chosen modules declare
#   early PREFIX      needed before the boot partition is mounted: these go into RAM
#
# Firmware that modules declare (modinfo "firmware=") is always included, newest version
# not above the declared one. The goal: storage, input, USB, wired and wireless networking
# on any x86-64 PC or laptop, plus the GPU drivers (until one loads, the screen is the
# firmware framebuffer via simpledrm). Sound and cameras are not needed yet.

# Storage
module drivers/ata/
module drivers/nvme/
module drivers/scsi/sd_mod
module drivers/scsi/sr_mod
module drivers/scsi/sg
module drivers/scsi/scsi_transport_sas
module drivers/scsi/virtio_scsi
module drivers/scsi/vmw_pvscsi
module drivers/scsi/hv_storvsc
module drivers/scsi/scsi_common
module drivers/scsi/mpt3sas/
module drivers/scsi/megaraid/
module drivers/scsi/smartpqi/
module drivers/scsi/hpsa
module drivers/scsi/aacraid/
module drivers/block/
module drivers/mmc/
module drivers/memstick/
module drivers/misc/cardreader/
module drivers/md/dm-mod
module drivers/cdrom/
module drivers/virtio/
module drivers/vhost/
skip drivers/block/drbd/
skip drivers/block/rnbd/
skip drivers/block/null_blk/

# USB, Thunderbolt, input
module drivers/usb/
skip drivers/usb/gadget/
skip drivers/usb/musb/
